site_name: ClamAV for Mere Mortals
site_description: An open source antivirus you run on your own machine. Scanning files and folders with a signature database you keep fresh yourself, a daemon that holds the database ready so scans start at once, quarantine for what it finds, and your own test signatures written and proved, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/clamav-for-mere-mortals/
copyright: 'Part of <a href="https://paulsullivan33-dev.github.io/mere-mortals/">For Mere Mortals</a> · Text CC BY 4.0, code MIT'

